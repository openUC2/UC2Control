apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// Optional release signing.
// Supply either a keystore.properties file in the repo root, or the
// KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD environment
// variables (GitHub Actions secrets). Without them CI still produces a working
// *unsigned* release APK, and debug APKs are always signed with the debug key.
// ---------------------------------------------------------------------------
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def resolvedStoreFile = keystoreProps.getProperty('storeFile', System.getenv('KEYSTORE_FILE'))
def hasReleaseSigning = resolvedStoreFile != null && file(resolvedStoreFile).exists()

// Daheng Galaxy SDK. Proprietary and not in git: copy it into app/libs/galaxy
// (README, "Daheng cameras") and the Daheng camera is built in; without it
// the build simply has no Daheng option.
def hasGalaxy = file('libs/galaxy/galaxy-android.jar').exists()

android {
    namespace 'com.openuc2.control'
    compileSdk 34

    defaultConfig {
        applicationId "com.openuc2.control"
        minSdk 21
        targetSdk 34
        // Overridable from CI:  -PappVersionCode=42 -PappVersionName=1.2.3
        versionCode project.hasProperty('appVersionCode') ? project.appVersionCode.toInteger() : 2
        versionName project.hasProperty('appVersionName') ? project.appVersionName : "2.0"
        vectorDrawables.useSupportLibrary = true
        buildConfigField 'boolean', 'DAHENG', String.valueOf(hasGalaxy)
    }

    sourceSets {
        main {
            if (hasGalaxy) {
                java.srcDirs += 'src/daheng/java'
                jniLibs.srcDirs += 'libs/galaxy/jniLibs'
            }
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(resolvedStoreFile)
                storePassword keystoreProps.getProperty('storePassword', System.getenv('KEYSTORE_PASSWORD'))
                keyAlias keystoreProps.getProperty('keyAlias', System.getenv('KEY_ALIAS'))
                keyPassword keystoreProps.getProperty('keyPassword', System.getenv('KEY_PASSWORD'))
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            // R8 stays off on purpose: usb-serial-for-android resolves its driver
            // classes reflectively, so a mis-shrunk release build fails only at
            // runtime, on a user's device. Not worth the few hundred KB.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.version', 'META-INF/*.kotlin_module']
        // Native libraries extracted on install, as Daheng's sample app requires.
        jniLibs.useLegacyPackaging = true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.12.0'

    // USB OTG serial (CDC-ACM, CP21xx, CH34x, FTDI, Prolific)
    implementation 'com.github.mik3y:usb-serial-for-android:3.7.0'

    // USB (UVC) webcams without root: libusb + libuvc, prebuilt for all ABIs
    implementation 'com.herohan:UVCAndroid:1.0.13'

    if (hasGalaxy) implementation files('libs/galaxy/galaxy-android.jar')

    testImplementation 'junit:junit:4.13.2'
    // android.jar's org.json is a stub on the JVM; the stage tests parse real frames
    testImplementation 'org.json:json:20240303'
}
